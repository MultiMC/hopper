# One production job at a time (contexts/production.conf)
CONTEXTS=production

# Started by hopper's trigger (daemon/trigger.py) for each new commit: config/production.env's
# PACKAGING_REPO and PACKAGING_BRANCH. A commit that doesn't raise VERSION is built and
# checked, and publishes nothing.
TRIGGER=git https://github.com/MultiMC/Packaging.git master
