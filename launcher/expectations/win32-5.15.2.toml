# What a win32-5.15.2 build must look like; checked by launcher/compat-check.py (see its --help).
# Generated on 2026-11-05 from the shipped mmc-develop-win32-5.15.2.zip (build 4249, the last one
# TeamCity built), then edited by hand:
# change it together with the Launcher change that needs it, and say why.

[files]
list = [
    "MultiMC.exe",
    "Qt5Core.dll",
    "Qt5Gui.dll",
    "Qt5Network.dll",
    "Qt5Svg.dll",
    "Qt5Widgets.dll",
    "Qt5Xml.dll",
    "iconengines/qsvgicon.dll",
    "imageformats/qgif.dll",
    "imageformats/qicns.dll",
    "imageformats/qico.dll",
    "imageformats/qjpeg.dll",
    "imageformats/qsvg.dll",
    "imageformats/qwbmp.dll",
    "imageformats/qwebp.dll",  # WebP icons, Launcher GH-2633 (2026-11-05)
    "jars/JavaCheck.jar",
    "jars/NewLaunch.jar",
    "libLauncher_iconfix.dll",
    "libLauncher_nbt++.dll",
    # no libLauncher_nbt++.dll.a: the import library isn't installed since Launcher d0c14302 (2026-11-09)
    "libLauncher_quazip.dll",
    "libcrypto-1_1.dll",
    "libgcc_s_dw2-1.dll",
    "libssl-1_1.dll",
    "libssp-0.dll",
    "libstdc++-6.dll",
    "libwinpthread-1.dll",
    "msvcr100.dll",  # the VC++ 2010 runtime for Qt's OpenSSL 1.1; not in build 4249 (2026-11-06)
    "platforms/qwindows.dll",
    "qt.conf",
    "styles/qwindowsvistastyle.dll",
    "zlib1.dll",
]

[pe]
machine = 332  # i386
# Our binaries are linked for Windows 7 (6.1, launcher/steps/win32.sh), Qt 5.15's minimum; in
# build 4249 they said 4.0, MinGW's default, and only the MSVC-built OpenSSL DLLs 5.1 (2026-11-06)
max_os_version = "6.1"
max_subsystem_version = "6.1"  # 6.1 = Windows 7
system_dlls = [
    "advapi32.dll",
    "bcrypt.dll",
    "crypt32.dll",
    "d3d11.dll",
    "dnsapi.dll",
    "dwmapi.dll",
    "dxgi.dll",
    "gdi32.dll",
    "imm32.dll",
    "iphlpapi.dll",
    "kernel32.dll",
    "mpr.dll",
    "msvcrt.dll",
    "netapi32.dll",
    "ole32.dll",
    "oleaut32.dll",
    "shell32.dll",
    "user32.dll",
    "userenv.dll",
    "uxtheme.dll",
    "version.dll",
    "winmm.dll",
    "ws2_32.dll",
    "wtsapi32.dll",
]

