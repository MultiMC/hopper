# hopper's offline image has no radios (keys/offline/build.sh). Bluetooth: its firmware isn't
# in the image, and on a real machine the drivers filled the console with errors (2026-11-14).
# Wi-Fi: every driver needs cfg80211, so none loads. `install ... /bin/false` and not
# `blacklist`: a blacklisted module still loads when another one pulls it in.
install bluetooth /bin/false
install btusb /bin/false
install btintel /bin/false
install btrtl /bin/false
install btbcm /bin/false
install btmtk /bin/false
install cfg80211 /bin/false
install mac80211 /bin/false
