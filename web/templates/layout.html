<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}hopper{{end}}</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/style.css">
<script src="/static/refresh.js" defer></script>
<script src="/static/cancel.js" defer></script>
</head>
<body>
<nav class="top">
  <a class="brand" href="/">hopper</a>
  <a href="/runs">Runs</a>
  {{with .Overview}}{{range .Setups}}<a href="/builds/{{.Name}}">{{.Name}}</a>
  {{end}}{{end}}<a href="/old-layout">Old layout</a>
  <span class="stale" id="stale" hidden>not updating</span>
</nav>
<main{{if .Refresh}} data-refresh{{end}}>
{{block "main" .}}{{end}}
</main>
{{block "after" .}}{{end}}
</body>
</html>
